apiVersion: v2
name: wordpress
description: >-
  Using the official WordPress image. This chart provides automation for
  installation, user management, plugin installation, and metrics.
type: application
version: 5.4.4
appVersion: 7.0.1
icon: >-
  https://raw.githubusercontent.com/slydlake/helm-charts/refs/heads/main/charts/wordpress/app.png
home: https://github.com/slydlake/helm-charts
maintainers:
  - name: slydlake
sources:
  - https://github.com/slydlake/helm-charts
annotations:
  artifacthub.io/category: networking
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: SlyCharts GitHub Repository
      url: https://github.com/slydlake/helm-charts/tree/main/charts/wordpress
    - name: Official WordPress Repository
      url: https://github.com/docker-library/
    - name: "SlyMetrics WordPress plugin for Prometheus Metrics"
      url: https://github.com/slydlake/slymetrics
    - name: Apache Metrics container
      url: https://github.com/Lusitaniae/apache_exporter
  artifacthub.io/maintainers: |
    - name: slydlake
      email: sly.dlake@gmail.com
  artifacthub.io/changes: |
    - kind: fixed
      description: "deps: update docker.io/redis:8.10.0-trixie docker digest to 39353c6"
      links:
        - name: GitHub
          url: https://github.com/SlyBase/helm-charts/commit/5608f0bd1cb9f1f843e19c81d389e08017c6f49e
    - kind: fixed
      description: "deps: update docker.io/wordpress:7.0.2-php8.3-apache docker digest to b2d7e31"
      links:
        - name: GitHub
          url: https://github.com/SlyBase/helm-charts/commit/9e7fc5d1a80a72e85bdbbdb6182827b43e6b3afa
    - kind: fixed
      description: "deps: update redis docker tag to v0.34.6"
      links:
        - name: GitHub
          url: https://github.com/SlyBase/helm-charts/commit/d394924f91e9a1131c3f6e0e71b9e36384384c66
    - kind: fixed
      description: "deps: update valkey docker tag to v0.25.1"
      links:
        - name: GitHub
          url: https://github.com/SlyBase/helm-charts/commit/00c08b0f0bbab56dca1a8d2a0a095ce2b6dfe2f5
  artifacthub.io/images: |
    - name: wordpress
      image: docker.io/wordpress:7.0.2-php8.3-apache
    - name: wordpress-cli
      image: docker.io/wordpress:cli-2.12.0-php8.3
    - name: metrics-apache
      image: docker.io/lusotycoon/apache-exporter:v1.1.1
    - name: mariadb
      image: docker.io/mariadb:12.3.2-noble
    - name: memcached
      image: docker.io/memcached:1.6.45
    - name: redis
      image: docker.io/redis:8.10.0-trixie
    - name: valkey
      image: docker.io/valkey/valkey:9.1.1-trixie
dependencies:
  - condition: memcached.enabled
    name: memcached
    repository: oci://registry-1.docker.io/cloudpirates
    version: 0.14.4
  - condition: redis.enabled
    name: redis
    repository: oci://registry-1.docker.io/cloudpirates
    version: 0.34.6
  - condition: valkey.enabled
    name: valkey
    repository: oci://registry-1.docker.io/cloudpirates
    version: 0.25.1
  - condition: mariadb.enabled
    name: mariadb
    repository: oci://registry-1.docker.io/cloudpirates
    version: 0.16.8
keywords:
  - wordpress
  - blog
