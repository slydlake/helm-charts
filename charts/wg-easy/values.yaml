## @section WG-Easy configuration
## @descriptionStart
## For more information see: https://wg-easy.github.io/wg-easy/latest/advanced/config/optional-config/
## @descriptionEnd
config:
  ## @param config.host string IP address web UI binds to (e.g. 0.0.0.0 or localhost)
  host: 0.0.0.0
  ## @param config.insecure bool Allow access over http (use if you don't have a valid https certificate)
  insecure: true
  ## @param config.disable_ipv6 bool Disable IPv6 support
  disable_ipv6: true

  ## @section Unattended setup configuration
  ## @descriptionStart
  ## For more information see: https://wg-easy.github.io/wg-easy/latest/advanced/config/unattended-setup/
  ## @descriptionEnd
  init:
    ## @param config.init.enabled bool Enable unattended setup with below env vars
    enabled: true
    ## @param config.init.existingSecret string Existing secret with keys "username" and "password"
    existingSecret: ""

    ## @extra config.init.username string Admin username (recommended: use existingSecret instead)
    ## @extra config.init.password string Admin password (recommended: use existingSecret instead)

    ## @param config.init.host string Host clients will connect to
    host: "vpn.example.com"
    ## @param config.init.dns string Global DNS setting for clients
    dns: "1.1.1.1,8.8.8.8"

    ## @param config.init.ipv4_cidr string IPv4 CIDR for WireGuard network
    ipv4_cidr: "10.8.0.0/24"
    ## @param config.init.ipv6_cidr string IPv6 CIDR for WireGuard network
    ipv6_cidr: "2001:0DB8::/32"

## @section Metrics
## @descriptionStart
## wg-easy ships a native Prometheus endpoint at /metrics/prometheus. Setting metrics.enabled wires
## ENABLE_PROMETHEUS_METRICS=true so it is turned on automatically instead of via the Admin Panel.
## Pair with serviceMonitor.create=true to scrape it, and metrics.grafanaDashboard.enabled=true for
## the official dashboard (Grafana.com ID 21733).
## NOTE: on some wg-easy image versions the env var is ignored and the toggle must still be set once
## in Admin Panel > General — see https://github.com/wg-easy/wg-easy/issues/1373.
## The endpoint is unauthenticated unless you set a Bearer password in the wg-easy UI; restrict it
## with networkPolicy in the meantime.
## @descriptionEnd
metrics:
  ## @param metrics.enabled bool Enable wg-easy's native Prometheus metrics endpoint (sets ENABLE_PROMETHEUS_METRICS=true)
  enabled: false
  grafanaDashboard:
    ## @param metrics.grafanaDashboard.enabled bool Deploy a ConfigMap with the official wg-easy Grafana dashboard (Grafana.com ID 21733)
    enabled: false
    ## @param metrics.grafanaDashboard.namespace string Namespace for the dashboard ConfigMap (defaults to the release namespace)
    namespace: ""
    ## @param metrics.grafanaDashboard.labels object Extra labels for the dashboard ConfigMap (grafana_dashboard: "1" is always added so the Grafana sidecar imports it)
    labels: {}

